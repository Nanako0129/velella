[package]
name = "velella-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
velella-core = { path = "../velella-core" }
uniffi = { version = "0.32", features = ["cli"] }
# Timers for the runtime, oneshot channels for the transport adapter (transport.rs).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
futures = "0.3"
