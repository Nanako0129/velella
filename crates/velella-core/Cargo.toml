[package]
name = "velella-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# No network stack here (plan NET): HTTP and the gateway WebSocket go through `transport.rs`,
# which the app implements on URLSession (TLS, trust and proxy from the system, like Safari).
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.8"
tracing = "0.1"
url = "2"
# Encodes X-Super-Properties.
base64 = "0.22"
# Code-block highlighting (highlight.rs, plan K6). Pinned, and only the bundled grammars with the
# pure-Rust regex engine: no oniguruma (C), no theme, plist or YAML loading, no HTML output.
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
